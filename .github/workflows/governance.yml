name: Governance Checks
on: [pull_request]

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install fairlearn scikit-learn pandas numpy huggingface_hub pytest pytest-cov -e ./src/model_card_generator -e ./src/bias_detection -e ./src/audit_trail -e ./src/human_in_the_loop

      - name: Verify test imports use repo sources
        run: |
          python -c "
          from pathlib import Path
          import audit_trail, bias_detection, human_in_the_loop, model_card_generator

          src = (Path.cwd() / 'src').resolve()
          modules = (
              audit_trail,
              bias_detection,
              human_in_the_loop,
              model_card_generator,
          )
          bad = []
          for module in modules:
              path = Path(module.__file__).resolve()
              if not path.is_relative_to(src):
                  bad.append(str(path))
          if bad:
              raise SystemExit('Imports resolved outside src/:\n' + '\n'.join(bad))
          print('Imports resolved from:', *[module.__file__ for module in modules], sep='\n  ')
          "

      - name: Run governance tests
        run: pytest tests/test_governance.py -v --tb=short