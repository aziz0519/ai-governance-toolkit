name: Governance Checks
on: [pull_request]

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: >-
          python -m pip install
          "fairlearn==0.14.0"
          "pytest==9.1.1"
          "pytest-cov==7.1.0"
          "pandas==3.0.5"
          "numpy==2.5.2"
          "scikit-learn==1.9.0"
          -e ./src/model_card_generator
          -e ./src/datasheet_generator
          -e ./src/bias_detection
          -e ./src/audit_trail
          -e ./src/human_in_the_loop

      - name: Verify test imports use repo sources
        run: |
          python -c "
          from pathlib import Path
          import audit_trail, bias_detection, datasheet_generator, human_in_the_loop, model_card_generator

          src = (Path.cwd() / 'src').resolve()
          modules = (
              audit_trail,
              bias_detection,
              datasheet_generator,
              human_in_the_loop,
              model_card_generator,
          )
          bad = []
          for module in modules:
              path = Path(module.__file__).resolve()
              if not path.is_relative_to(src):
                  bad.append(str(path))
          if bad:
              raise SystemExit('Imports resolved outside src/:\n' + '\n'.join(bad))
          print('Imports resolved from:', *[module.__file__ for module in modules], sep='\n  ')
          "

      - name: Run governance tests
        run: pytest tests/test_governance.py -v --tb=short
