[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-governance-toolkit-llm-bias-test"
version = "0.1.0"
description = "Perturbation test utilities for LLM bias evaluation"
requires-python = ">=3.14"

[tool.setuptools]
packages = ["llm_bias_test"]

[tool.setuptools.package-dir]
llm_bias_test = "."