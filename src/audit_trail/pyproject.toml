[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-governance-toolkit-audit-trail"
version = "0.1.0"
description = "Hash-chained audit trails for model predictions"
requires-python = ">=3.14"

[tool.setuptools]
packages = ["audit_trail"]

[tool.setuptools.package-dir]
audit_trail = "."