[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-governance-toolkit-model-card-generator"
version = "0.1.0"
description = "Model card generation utilities"
requires-python = ">=3.14"
dependencies = ["scikit-learn"]

[tool.setuptools]
packages = ["model_card_generator"]

[tool.setuptools.package-dir]
model_card_generator = "."